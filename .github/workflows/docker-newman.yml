name: Lab04 Docker and Newman Verification

on:
  push:
  pull_request:

jobs:
  docker-newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI
        run: |
          npx spectral lint contracts/*.yaml --ruleset ./.spectral.yaml

      - name: Build Docker image
        run: |
          docker build -t fit4110/iot-ingestion:lab04 .

      - name: Start container
        run: |
          docker run -d \
            --name fit4110-iot-lab04 \
            -p 8000:8000 \
            fit4110/iot-ingestion:lab04

      - name: Check container
        run: |
          sleep 30
          docker ps -a
          docker logs fit4110-iot-lab04 || true
          curl http://localhost:8000/health || true

      - name: Run Newman
        run: npm run test:local

      - name: Show logs if failed
        if: failure()
        run: |
          docker logs fit4110-iot-lab04 || true

      - name: Stop container
        if: always()
        run: |
          docker stop fit4110-iot-lab04 || true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab04-newman-reports
          path: reports